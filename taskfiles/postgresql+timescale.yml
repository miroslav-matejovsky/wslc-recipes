# PostgreSQL + TimescaleDB + pgAdmin recipe -> scripts/postgresql+timescale.ps1
version: '3'

vars:
  PS: pwsh -NoProfile -ExecutionPolicy Bypass -File
  SCRIPT: scripts/postgresql+timescale.ps1
  TARGET: '{{.CLI_ARGS | default "db"}}'

tasks:
  up:
    desc: '[timescale] Create/start TimescaleDB + pgAdmin and wait until ready'
    cmds: ['{{.PS}} {{.SCRIPT}} up']
  stop:
    desc: '[timescale] Stop the containers (keep them and their data)'
    cmds: ['{{.PS}} {{.SCRIPT}} stop']
  down:
    desc: '[timescale] Remove the containers, keep the data volumes'
    cmds: ['{{.PS}} {{.SCRIPT}} down']
  reset:
    desc: '[timescale] Remove the containers, data volumes and network'
    prompt: This deletes all TimescaleDB and its pgAdmin data. Continue?
    cmds: ['{{.PS}} {{.SCRIPT}} reset']
  status:
    desc: '[timescale] Show container/volume state'
    cmds: ['{{.PS}} {{.SCRIPT}} status']
  info:
    desc: '[timescale] Print connection details'
    cmds: ['{{.PS}} {{.SCRIPT}} info']
  logs:
    desc: '[timescale] Show logs (task timescale:logs [-- pgadmin])'
    cmds: ['{{.PS}} {{.SCRIPT}} logs {{.TARGET}}']
  shell:
    desc: '[timescale] Open psql inside the container (task timescale:shell [-- pgadmin])'
    interactive: true
    cmds: ['{{.PS}} {{.SCRIPT}} shell {{.TARGET}}']
  pull:
    desc: '[timescale] Pull the images'
    cmds: ['{{.PS}} {{.SCRIPT}} pull']
  pgadmin:
    desc: '[timescale] Open pgAdmin in the browser'
    cmds: ['{{.PS}} {{.SCRIPT}} pgadmin']
